name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      BASHDOCK_LOCKED_BUILD: '1'
      BASHDOCK_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check version and release tag
        shell: pwsh
        run: |
          node scripts/sync-version.cjs --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:BASHDOCK_RELEASE_TAG -and $env:BASHDOCK_RELEASE_TAG -ne "v$version") {
            throw "Release tag must match package.json: expected v$version"
          }
      - name: Install locked Windows build environment
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r requirements/windows-build.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git --version
      - name: Check native clipboard, paste confirmation, and mouse preferences
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_clipboard.py -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k m5 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }
      - name: Run Python, Windows shell, WebEngine, and JavaScript tests
        run: npm test
      - name: Check popup shadows with native Windows and headless rendering
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            foreach ($platform in @("offscreen", "windows")) {
              $env:QT_QPA_PLATFORM = $platform
              foreach ($scale in @("1", "1.25", "1.5")) {
                $env:QT_SCALE_FACTOR = $scale
                Write-Host "Checking popup menus: backend=$platform, scale=$scale"
                .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k popup -v
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k inactive_tab_tints -v
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          }
      - name: Check tab operations and restored footer with native Windows scaling
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            foreach ($scale in @("1", "1.25", "1.5")) {
              $env:QT_SCALE_FACTOR = $scale
              Write-Host "Checking tabs and footer: native Windows, scale=$scale"
              .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k tab -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          }
      - name: Check update notice and window transitions with native Windows scaling
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            foreach ($scale in @("1", "1.25", "1.5")) {
              $env:QT_SCALE_FACTOR = $scale
              Write-Host "Checking M9 window transitions: native Windows, scale=$scale"
              .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k m9 -v
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          }
      - name: Check saved workspace dialogs and shell startup with native Windows
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k m3 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k saved_workspace_buttons -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }
      - name: Check interactive terminal keys and pager with native Windows
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k m4 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }
      - name: Check terminal settings dialogs and live appearance with native Windows
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k m6 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k m6 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }
      - name: Check settings export, import, and recovery with native Windows
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k m7 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k m7 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }
      - name: Check quit confirmation and process cleanup with native Windows
        shell: pwsh
        run: |
          $previousPlatform = $env:QT_QPA_PLATFORM
          try {
            $env:QT_QPA_PLATFORM = "windows"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k m8 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k m8 -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            $env:QT_QPA_PLATFORM = $previousPlatform
          }
      - name: Compile, test executable, and create portable ZIP
        run: npm run package
      - name: Verify ZIP checksum and run extracted executable
        run: .venv/Scripts/python.exe scripts/verify_release.py
      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bashdock-windows-x64
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-diagnostics
          path: |
            build/*.json
            build/bashdock/warn-bashdock.txt
          if-no-files-found: ignore
          retention-days: 14

  draft-release:
    name: Create draft GitHub release
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bashdock-windows-x64
          path: release
      - name: Sign automatic-update metadata
        env:
          BASHDOCK_UPDATE_SIGNING_KEY: ${{ secrets.BASHDOCK_UPDATE_SIGNING_KEY }}
        run: python3 scripts/publish_update.py --artifacts release
      - name: Attach validated assets to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if ! jq -e '.isDraft == true' existing-release.json > /dev/null; then
              echo 'A published release already exists; refusing to replace its files.' >&2
              exit 1
            fi
            gh release upload "$TAG" release/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/* --verify-tag --draft --title "BashDock $TAG" \
              --notes-file .github/RELEASE_NOTES.md --generate-notes "${flags[@]}"
          fi
