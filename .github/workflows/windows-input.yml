name: Windows input compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input:
    name: Git ${{ matrix.git }} / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        git: [runner, '2.55.0.windows.4']
        python: ['3.12', '3.14']
    env:
      PYTHONUNBUFFERED: '1'
      QT_QPA_PLATFORM: windows
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install Git for Windows 2.55.0.windows.4
        if: matrix.git == '2.55.0.windows.4'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PortableGit-2.55.0.4-64-bit.7z.exe'
          $gitRoot = Join-Path $env:RUNNER_TEMP 'bashdock-test-git'
          Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.4/PortableGit-2.55.0.4-64-bit.7z.exe' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '016e84230a3767f0c6b3788e79ba0c58a17377086801719d46700fca4f7b36b5') {
            throw 'Portable Git checksum does not match the pinned upstream release'
          }
          7z x $archive "-o$gitRoot" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $gitRoot 'cmd' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          'MSYSTEM=MINGW64' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record selected shell runtime
        shell: pwsh
        run: |
          git --version
          .venv/Scripts/python.exe -c "import subprocess; from bashdock.config import find_bash; bash = find_bash(); print('Selected Bash:', bash, flush=True); subprocess.run([bash, '-c', 'bash --version; uname -r'], check=True)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.git }}' -eq '2.55.0.windows.4' -and (git --version) -ne 'git version 2.55.0.windows.4') {
            throw 'The compatibility test selected the wrong Git installation'
          }
      - name: Check command editing, icon search and per-button confirmation
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_command_editor.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_command_presets.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_tab_icon_picker.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_workspace.py -k command_confirmation -k confirmation_acceptance -k confirmation_edits -k multiline -k command_presets -k tab_rename_dialog -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check updater TLS response cleanup
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_update_tls.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeat command execution and interactive interrupt checks
        shell: pwsh
        run: |
          .venv/Scripts/python.exe -m unittest discover -s tests -p test_qt_lifecycle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($attempt in 1..3) {
            Write-Host "Input compatibility round $attempt of 3"
            .venv/Scripts/python.exe -m unittest discover -s tests -p test_windows.py -k command_button_ -k first_button_in_hidden_tab -k m4_history_editing_completion_interrupt_and_unicode -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
