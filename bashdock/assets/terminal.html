<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="xterm.css">
<style>
html,body{height:100%;margin:0;background:#10141c;overflow:hidden}
:root{--scrollbar-track:#1e222a;--scrollbar-thumb:#45484e;--scrollbar-hover:#585b60;--scrollbar-active:#6b6d72}
/* Keep spacing outside xterm's measured host so FitAddon sees usable space. */
#terminal-frame{position:absolute;inset:12px;overflow:hidden}
#terminal{width:100%;height:100%;padding:0}
/* Keep the viewport/scrollbar full height even when whole text rows leave a remainder. */
#terminal > .xterm{height:100%}
/* Qt WebEngine renders xterm's scrollbar independently of the native Qt theme. */
.xterm .xterm-viewport::-webkit-scrollbar{width:12px;height:12px;background:var(--scrollbar-track)}
.xterm .xterm-viewport::-webkit-scrollbar-track{background:var(--scrollbar-track);border-radius:6px}
.xterm .xterm-viewport::-webkit-scrollbar-thumb{
    background:var(--scrollbar-thumb);border:3px solid var(--scrollbar-track);border-radius:6px;min-height:28px;
    background-clip:padding-box;
}
.xterm .xterm-viewport::-webkit-scrollbar-thumb:hover{background-color:var(--scrollbar-hover)}
.xterm .xterm-viewport::-webkit-scrollbar-thumb:active{background-color:var(--scrollbar-active)}
.xterm .xterm-viewport::-webkit-scrollbar-button{display:none;width:0;height:0}
.xterm .xterm-viewport::-webkit-scrollbar-corner{background:var(--scrollbar-track)}
</style>
</head><body><div id="terminal-frame"><div id="terminal"></div></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="xterm.js"></script><script src="addon-fit.js"></script>
<script src="terminal.js"></script></body></html>
