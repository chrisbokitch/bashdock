[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gitbasher"
version = "0.1.0"
description = "Git Bash with a configurable command button bar for Windows"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pywinpty>=3,<4; sys_platform == 'win32'"]

[project.gui-scripts]
gitbasher = "gitbasher.app:main"

[tool.setuptools.package-data]
gitbasher = ["assets/*"]
