[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bashdock"
dynamic = ["version"]
description = "Git Bash with a configurable command button bar for Windows"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pywinpty>=3.0.5,<4; sys_platform == 'win32'"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
bashdock = "bashdock.app:main"

[tool.setuptools.package-data]
bashdock = ["assets/*"]

[tool.setuptools.dynamic]
version = {attr = "bashdock._version.__version__"}
